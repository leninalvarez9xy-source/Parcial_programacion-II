<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            font-family: Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
        }

        .login{
            width:300px;
            padding:20px;
            background:white;
            border:1px solid #ccc;
            border-radius:8px;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
        }

    </style>

</head>

<body>

<div class="login">

<h2>Iniciar Sesión</h2>

<form method="POST">

Usuario:

<input type="text"
       name="usuario"
       required>

Contraseña:

<input type="password"
       name="password"
       required>

<button type="submit">
Ingresar
</button>

</form>

</div>

</body>
</html>
